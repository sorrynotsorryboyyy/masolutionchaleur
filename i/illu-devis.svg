<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="Comparaison de plusieurs devis">
  <title>Comparaison de plusieurs devis</title>

  <!-- Devis en retrait, gauche -->
  <g opacity=".55">
    <rect x="24" y="72" width="108" height="150" rx="10" fill="#ffffff" stroke="#07391D" stroke-width="5"/>
    <path d="M44 104h68M44 124h68M44 144h44" stroke="#9EAFA9" stroke-width="6" stroke-linecap="round"/>
    <rect x="44" y="176" width="52" height="18" rx="9" fill="#E9F5F1"/>
  </g>

  <!-- Devis en retrait, droite -->
  <g opacity=".55">
    <rect x="288" y="72" width="108" height="150" rx="10" fill="#ffffff" stroke="#07391D" stroke-width="5"/>
    <path d="M308 104h68M308 124h68M308 144h44" stroke="#9EAFA9" stroke-width="6" stroke-linecap="round"/>
    <rect x="308" y="176" width="52" height="18" rx="9" fill="#E9F5F1"/>
  </g>

  <!-- Devis retenu, au centre -->
  <rect x="140" y="46" width="140" height="196" rx="14" fill="#ffffff" stroke="#07391D" stroke-width="7"/>
  <path d="M166 88h88M166 112h88M166 136h56" stroke="#07391D" stroke-width="7" stroke-linecap="round"/>
  <rect x="166" y="168" width="88" height="26" rx="13" fill="#F97A12"/>

  <!-- Badge de validation -->
  <circle cx="272" cy="60" r="26" fill="#41CF1A" stroke="#ffffff" stroke-width="6"/>
  <path d="M261 60l8 8 15-15" stroke="#ffffff" stroke-width="6" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>

  <!-- Socle -->
  <path d="M40 262h340" stroke="#CCE2DA" stroke-width="5" stroke-linecap="round"/>
</svg>
